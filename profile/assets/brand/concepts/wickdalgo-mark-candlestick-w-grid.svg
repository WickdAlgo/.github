<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">WickdAlgo continuous candlestick W concept</title>
  <desc id="description">Seventeen continuous OHLC candles arranged on a fixed grid to form a natural W-shaped price path.</desc>
  <metadata>
    Grid and OHLC source: wickdalgo-mark-candlestick-w-grid.json
    Price mapping: y = 820 - (price - 40) * 12
    Continuity invariant: each candle close equals the next candle open.
  </metadata>
  <style>
    .up { fill: #31805A; }
    .down { fill: #666666; }
  </style>
